name: boilerplate_flutter
description: "Application with Clean Architecture, GetX, and Hive"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  logger: ^2.5.0
  connectivity_plus: ^6.1.3
  fpdart: ^1.1.1
  equatable: ^2.0.7
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  gap: ^3.0.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  flutter_animate: ^4.5.2
  get: ^4.7.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
