name: boilerplate_flutter
description: "Application with Clean Architecture, Riverpod, and GoRouter"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  logger: ^2.5.0
  connectivity_plus: ^6.1.3
  shared_preferences: ^2.3.5
  fpdart: ^1.1.1
  equatable: ^2.0.7
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  gap: ^3.0.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  flutter_animate: ^4.5.2
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: 9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
